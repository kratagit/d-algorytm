name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # Testy dotyczą silnika i skryptów budowania - Eel nie jest potrzebny
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest -q
